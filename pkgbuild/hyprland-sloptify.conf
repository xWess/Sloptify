# Optional Hyprland rules: park the Web Player on a silent special workspace.
# Source from ~/.config/hypr/hyprland.conf:
#   source = /usr/share/Sloptify/hyprland-Sloptify.conf

windowrulev2 = workspace special:Sloptify-player silent, class:^(Sloptify-player)$
windowrulev2 = noinitialfocus, class:^(Sloptify-player)$
windowrulev2 = float, class:^(Sloptify-player)$
