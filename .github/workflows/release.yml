name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev \
            libxdo-dev libasound2-dev

      - name: Build release binary
        run: cargo build --release -p sloptify

      - name: Fetch linuxdeploy
        run: |
          curl -fsSL -o /tmp/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /tmp/linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage /tmp/linuxdeploy-plugin-appimage-x86_64.AppImage

      - name: Build AppImage
        env:
          LINUXDEPLOY: /tmp/linuxdeploy-x86_64.AppImage
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          chmod +x packaging/appimage/build.sh
          packaging/appimage/build.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage*

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p sloptify

      - name: Stage Windows package
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/sloptify.exe "dist/Sloptify-$ver-x86_64.exe"
          Compress-Archive -Path "dist/Sloptify-$ver-x86_64.exe" -DestinationPath "dist/Sloptify-$ver-windows-x86_64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  publish:
    needs: [linux-appimage, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage*' -o -name '*.exe' -o -name '*.zip' \) -exec cp -v {} release/ \;
          ls -la release

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Sloptify ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
