<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180" role="img" aria-label="Sloptify cassette">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#3a322c"/>
      <stop offset="0.55" stop-color="#241e1a"/>
      <stop offset="1" stop-color="#161210"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e6d4"/>
      <stop offset="1" stop-color="#e0d0bc"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c45c3a"/>
      <stop offset="1" stop-color="#8f3d28"/>
    </linearGradient>
    <radialGradient id="coil" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6a4528"/>
      <stop offset="0.55" stop-color="#3f2818"/>
      <stop offset="1" stop-color="#23160e"/>
    </radialGradient>
    <radialGradient id="coilgloss" cx="36%" cy="30%" r="46%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f0e4cb"/>
      <stop offset="0.6" stop-color="#c9be9d"/>
      <stop offset="1" stop-color="#8f846c"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="window">
      <rect x="18" y="18" width="264" height="144" rx="10"/>
    </clipPath>
  </defs>

  <!-- shell -->
  <rect x="8" y="8" width="284" height="164" rx="14" fill="url(#shell)"/>
  <rect x="8" y="8" width="284" height="164" rx="14" fill="none" stroke="#0c0a09" stroke-opacity="0.7" stroke-width="1.2"/>
  <rect x="10" y="10" width="280" height="12" rx="6" fill="#fff" fill-opacity="0.07"/>

  <!-- screws -->
  <g fill="#1a1612" stroke="#5a5048" stroke-width="0.7">
    <circle cx="22" cy="24" r="4.2"/><circle cx="278" cy="24" r="4.2"/>
    <circle cx="22" cy="156" r="4.2"/><circle cx="278" cy="156" r="4.2"/>
  </g>
  <g fill="#c9be9d" opacity="0.55">
    <rect x="20" y="23.2" width="4" height="1.4" rx="0.4"/>
    <rect x="276" y="23.2" width="4" height="1.4" rx="0.4"/>
    <rect x="20" y="155.2" width="4" height="1.4" rx="0.4"/>
    <rect x="276" y="155.2" width="4" height="1.4" rx="0.4"/>
  </g>

  <!-- J-card -->
  <rect x="36" y="20" width="228" height="42" rx="3" fill="url(#cream)"/>
  <rect x="36" y="20" width="228" height="12" fill="url(#band)"/>
  <text x="44" y="29" fill="#f6efde" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" letter-spacing="1.4">SLOPTIFY · TYPE I</text>
  <text id="cass-title" x="44" y="46" fill="#26324f" font-family="Bradley Hand, Segoe Print, Marker Felt, cursive" font-size="14">__TITLE__</text>
  <rect x="44" y="50" width="160" height="1" fill="#7a613d" fill-opacity="0.35"/>
  <text id="cass-artist" x="44" y="58" fill="#3a4a63" font-family="Bradley Hand, Segoe Print, Marker Felt, cursive" font-size="9">__ARTIST__</text>
  <rect x="244" y="22" width="16" height="10" rx="1.5" fill="#f6efde" stroke="#c45c3a" stroke-width="1"/>
  <text x="252" y="29.5" text-anchor="middle" fill="#26324f" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">A</text>

  <!-- window recess -->
  <rect x="28" y="70" width="244" height="78" rx="6" fill="#0b0a0f"/>
  <rect x="28" y="70" width="244" height="78" rx="6" fill="none" stroke="#000" stroke-opacity="0.45"/>

  <!-- supply reel (fuller) -->
  <g id="reel-supply">
    <circle cx="95" cy="109" r="30" fill="url(#coil)"/>
    <circle cx="95" cy="109" r="26" fill="none" stroke="rgba(20,12,6,0.4)" stroke-width="1.2"/>
    <circle cx="95" cy="109" r="21" fill="none" stroke="rgba(255,220,170,0.12)" stroke-width="1.2"/>
    <circle cx="95" cy="109" r="16" fill="none" stroke="rgba(20,12,6,0.35)" stroke-width="1.2"/>
    <circle cx="95" cy="109" r="30" fill="url(#coilgloss)"/>
    <g id="hub-supply">
      <circle cx="95" cy="109" r="11" fill="url(#hub)" stroke="#b6a988" stroke-width="1"/>
      <circle cx="95" cy="109" r="11" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.55"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(0 95 109)"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(60 95 109)"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(120 95 109)"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(180 95 109)"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(240 95 109)"/>
      <rect x="93.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(300 95 109)"/>
      <circle cx="95" cy="109" r="4.4" fill="#161019"/>
    </g>
  </g>

  <!-- take-up reel (emptier) -->
  <g id="reel-take">
    <circle id="take-coil" cx="205" cy="109" r="20" fill="url(#coil)"/>
    <circle cx="205" cy="109" r="16" fill="none" stroke="rgba(20,12,6,0.4)" stroke-width="1.2"/>
    <circle cx="205" cy="109" r="20" fill="url(#coilgloss)"/>
    <g id="hub-take">
      <circle cx="205" cy="109" r="11" fill="url(#hub)" stroke="#b6a988" stroke-width="1"/>
      <circle cx="205" cy="109" r="11" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.55"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(0 205 109)"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(60 205 109)"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(120 205 109)"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(180 205 109)"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(240 205 109)"/>
      <rect x="203.9" y="99.4" width="2.2" height="3.6" rx="0.6" fill="#6a5f45" transform="rotate(300 205 109)"/>
      <circle cx="205" cy="109" r="4.4" fill="#161019"/>
    </g>
  </g>

  <!-- tape path across head -->
  <path d="M95 132 C 108 142 125 141 138 141 L 162 141 C 175 141 192 142 205 132" fill="none" stroke="#33220f" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M95 132 C 108 142 125 141 138 141 L 162 141 C 175 141 192 142 205 132" fill="none" stroke="#c45c3a" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round"/>
  <rect x="128" y="136" width="44" height="12" rx="2" fill="#141019"/>
  <circle cx="138" cy="148" r="2.3" fill="#0a090c"/>
  <circle cx="162" cy="148" r="2.3" fill="#0a090c"/>

  <!-- glass sheen -->
  <rect x="28" y="70" width="244" height="78" rx="6" fill="url(#pane)"/>
  <rect x="28" y="70" width="244" height="6" fill="#fff" fill-opacity="0.05"/>

  <!-- feet / pegs -->
  <ellipse cx="70" cy="162" rx="10" ry="5" fill="#0c0a09"/>
  <ellipse cx="230" cy="162" rx="10" ry="5" fill="#0c0a09"/>
  <rect x="120" y="158" width="60" height="8" rx="2" fill="#1a1612"/>
</svg>
