<!DOCTYPE html>
<html lang="en" style="background:#121212;color:#fff">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Sloptify</title>
<style>
  /* No remote @import — WebKit with_html blocks/hangs on external CSS and leaves a white page. */
  :root {
    --bg: #121212;
    --surface: #181818;
    --tile: #282828;
    --tile2: #333;
    --text: #fff;
    --muted: #b3b3b3;
    --green: #1ed760;
    --rail: 232px;
    --player-h: 84px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #121212 !important; color: #fff !important;
    font-family: "IBM Plex Sans", "Noto Sans", "Segoe UI", Ubuntu, Cantarell, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input { font: inherit; color: var(--text); }
  #app { display: grid; height: 100%; }
  @media (min-width: 960px) {
    #app { grid-template-columns: var(--rail) 1fr; grid-template-rows: 1fr var(--player-h); }
    #rail { grid-row: 1 / 3; }
    #main { grid-column: 2; overflow: auto; }
    #player { grid-column: 2; }
    #tabs { display: none; }
  }
  @media (max-width: 959px) {
    #app { grid-template-rows: 1fr var(--player-h) var(--nav-h); }
    #rail { display: none; }
    #main { overflow: auto; }
  }
  #rail {
    background: #000;
    padding: 28px 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .brand {
    font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 28px;
  }
  .nav-btn {
    text-align: left; padding: 12px 14px; border-radius: 8px;
    color: var(--muted); font-weight: 600; font-size: 0.98rem;
  }
  .nav-btn.on, .nav-btn:hover { color: var(--text); background: var(--tile); }
  #main { padding: 28px 28px 20px; background: linear-gradient(180deg, #1a1a1a 0%, var(--bg) 220px); }
  .greet { font-size: 2rem; font-weight: 700; margin: 0 0 18px; letter-spacing: -0.03em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    padding: 8px 16px; border-radius: 999px; background: var(--tile);
    font-weight: 600; font-size: 0.86rem;
  }
  .chip.on { background: var(--text); color: #000; }
  .qa {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    margin-bottom: 32px;
  }
  @media (min-width: 1100px) { .qa { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .qa-tile {
    display: flex; align-items: center; gap: 0; background: var(--tile);
    border-radius: 6px; overflow: hidden; min-height: 64px; text-align: left;
    transition: background .15s;
  }
  .qa-tile:hover { background: var(--tile2); }
  .qa-tile img, .ph {
    width: 64px; height: 64px; object-fit: cover; flex: none; background: #3a3a3a;
  }
  .qa-tile span { padding: 0 12px; font-weight: 650; font-size: 0.92rem; line-height: 1.25; }
  .shelf { margin-bottom: 30px; }
  .shelf h2 { font-size: 1.35rem; margin: 0 0 14px; letter-spacing: -0.02em; }
  .row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .card { width: 168px; flex: none; text-align: left; }
  .card .art {
    position: relative; width: 168px; height: 168px; border-radius: 8px;
    overflow: hidden; background: var(--tile); margin-bottom: 10px;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .play {
    position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px;
    border-radius: 50%; background: var(--green); color: #000;
    display: grid; place-items: center; font-size: 1.1rem;
    opacity: 0; transform: translateY(8px); transition: .15s; box-shadow: 0 8px 18px #0008;
  }
  .card:hover .play { opacity: 1; transform: none; }
  .card .t { font-weight: 650; font-size: 0.92rem; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { color: var(--muted); font-size: 0.82rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border-radius: 8px; text-align: left; width: 100%;
  }
  .row-item:hover { background: var(--tile); }
  .row-item img, .row-item .ph { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #333; }
  .row-item .meta { min-width: 0; }
  .row-item .t { font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-item .s { color: var(--muted); font-size: 0.82rem; margin: 2px 0 0; }
  .search-box {
    display: flex; gap: 10px; margin-bottom: 18px;
  }
  .search-box input {
    flex: 1; background: #fff; color: #000; border-radius: 999px;
    padding: 14px 18px; outline: none; border: 0; font-weight: 500;
  }
  .search-box button {
    background: var(--green); color: #000; font-weight: 700;
    border-radius: 999px; padding: 0 22px;
  }
  #player {
    background: #181818; border-top: 1px solid #222;
    display: grid; grid-template-columns: 1.2fr 1.4fr 1fr; align-items: center;
    gap: 16px; padding: 0 16px;
  }
  .np { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
  .np img, .np .ph { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #333; }
  .np .t { font-weight: 650; font-size: 0.9rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .s { color: var(--muted); font-size: 0.78rem; margin: 2px 0 0; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .btns { display: flex; align-items: center; gap: 18px; }
  .btns .main {
    width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #000;
    display: grid; place-items: center; font-size: 1rem;
  }
  .scrub { display: flex; align-items: center; gap: 8px; width: min(480px, 100%); color: var(--muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
  .scrub input[type=range] { flex: 1; accent-color: var(--green); }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: var(--muted); }
  .right input[type=range] { width: 100px; accent-color: var(--green); }
  #tabs {
    display: flex; justify-content: space-around; align-items: center;
    background: #000; border-top: 1px solid #222;
  }
  #tabs button { color: var(--muted); font-weight: 600; font-size: 0.72rem; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  #tabs button.on { color: var(--text); }
  .gate {
    height: 100%; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, #1f3d2a 0%, var(--bg) 55%);
  }
  .gate h1 { font-size: 3rem; margin: 0 0 8px; letter-spacing: -0.04em; }
  .gate p { color: var(--muted); max-width: 360px; margin: 0 auto 24px; line-height: 1.45; }
  .gate .cta {
    background: var(--green); color: #000; font-weight: 700; font-size: 1rem;
    padding: 14px 36px; border-radius: 999px;
  }
  #sheet {
    position: fixed; inset: 0; background: #0d1f14; z-index: 20;
    display: none; flex-direction: column; padding: 24px 28px 32px;
  }
  #sheet.open { display: flex; }
  #sheet .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); margin-bottom: 18px; }
  #sheet .cover {
    width: min(420px, 70vmin); aspect-ratio: 1; margin: 0 auto 28px;
    border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px #000a;
    background: var(--tile);
  }
  #sheet .cover img { width: 100%; height: 100%; object-fit: cover; }
  #sheet .title { font-size: 1.6rem; font-weight: 700; margin: 0; }
  #sheet .artist { color: var(--muted); margin: 6px 0 22px; }
  #sheet .big-controls { display: flex; justify-content: center; align-items: center; gap: 28px; margin-top: 10px; }
  #sheet .big-controls .main {
    width: 68px; height: 68px; border-radius: 50%; background: #fff; color: #000;
    font-size: 1.5rem; display: grid; place-items: center;
  }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; }
</style>
</head>
<body style="background:#121212;color:#fff;margin:0">
<div id="root" style="min-height:100%;background:#121212;color:#fff">
  <div style="display:grid;place-items:center;height:100vh;font:600 28px/1.2 'IBM Plex Sans',sans-serif">Sloptify</div>
</div>
<script>
const send = (cmd) => {
  try {
    if (window.ipc && typeof window.ipc.postMessage === "function") {
      window.ipc.postMessage(JSON.stringify(cmd));
    }
  } catch (e) { console.error(e); }
};
let state = { phase: "Starting", status: "Connecting to Spotify…", home: { greeting: "", chips: [], shelves: [] }, searchResults: [], library: [], snapshot: { ready: false, state: null } };
let nav = "home";
let chip = 0;
let searchQ = "";
let sheetOpen = false;

function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function trunc(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function ms(n){ n=Math.max(0,Math.floor((n||0)/1000)); const m=Math.floor(n/60), s=n%60; return m+":"+String(s).padStart(2,"0"); }
function art(url, cls){ return url ? `<img class="${cls||""}" src="${esc(url)}" alt="" />` : `<div class="ph ${cls||""}"></div>`; }
function now(){
  const s = state.snapshot && state.snapshot.state;
  if (!s || !s.track) return { title: "Nothing playing", artist: "Pick something from Home", paused: true, pos:0, dur:1, image:null, context: "" };
  const artists = (s.track.artists||[]).map(a=>a.name).filter(Boolean).join(", ") || "—";
  return { title: s.track.name || "Unknown", artist: artists, paused: !!s.isPaused, pos: s.positionMs||0, dur: Math.max(1,s.durationMs||1), image: s.track.image||null, context: s.contextName||"" };
}

function render(){
  const root = document.getElementById("root");
  if (state.phase === "Starting" || state.phase === "Error") {
    root.innerHTML = `<div class="gate"><h1>Sloptify</h1><p>${esc(state.status || (state.phase==="Starting"?"Connecting to Spotify…":"Something went wrong"))}</p>
      ${state.phase==="Error"?`<button class="cta" onclick="send({cmd:'ContinueAfterLogin'})">Try again</button>`:""}</div>`;
    return;
  }
  if (state.phase === "NeedsLogin") {
    root.innerHTML = `<div class="gate"><h1>Sloptify</h1><p>${esc(state.status||"Sign in once with Spotify — then it stays signed in.")}</p>
      <button class="cta" onclick="send({cmd:'ShowLogin'})">Log in with Spotify</button>
      <p class="muted" style="margin-top:16px;font-size:.85rem">One-time sign-in. The Web Player stays hidden after that.</p></div>`;
    return;
  }
  const np = now();
  const shelves = (state.home && state.home.shelves) || [];
  const first = shelves[0];
  const rest = shelves.slice(1);
  const chips = (state.home && state.home.chips && state.home.chips.length) ? state.home.chips : [{id:"",label:"All"}];
  const greet = (state.home && state.home.greeting) || "Good listening";

  let main = "";
  if (nav === "home") {
    main = `<h1 class="greet">${esc(greet)}</h1>
      <div class="chips">${chips.map((c,i)=>`<button class="chip ${i===chip?"on":""}" onclick="setChip(${i},'${esc(c.id)}')">${esc(c.label)}</button>`).join("")}</div>`;
    if (!shelves.length) main += `<div class="empty">Loading your home…</div>`;
    else {
      if (first) {
        main += `<div class="qa">${first.items.slice(0,8).map(it=>`
          <button class="qa-tile" onclick="send({cmd:'PlayUri',uri:'${esc(it.uri)}'})">
            ${art(it.image)}<span>${esc(trunc(it.name,28))}</span>
          </button>`).join("")}</div>`;
      }
      main += rest.map(sh => `
        <section class="shelf"><h2>${esc(sh.title)}</h2>
          <div class="row">${(sh.items||[]).map(it=>`
            <button class="card" onclick="send({cmd:'PlayUri',uri:'${esc(it.uri)}'})">
              <div class="art">${art(it.image)}<span class="play">▶</span></div>
              <p class="t">${esc(trunc(it.name,22))}</p>
              <p class="s">${esc(trunc(it.subtitle||"",24))}</p>
            </button>`).join("")}</div>
        </section>`).join("");
    }
  } else if (nav === "search") {
    main = `<h1 class="greet">Search</h1>
      <div class="search-box">
        <input id="sq" value="${esc(searchQ)}" placeholder="What do you want to listen to?" onkeydown="if(event.key==='Enter')doSearch()" />
        <button onclick="doSearch()">Go</button>
      </div>
      <div class="list">${(state.searchResults||[]).map(it=>`
        <button class="row-item" onclick="send({cmd:'PlayUri',uri:'${esc(it.uri)}'})">
          ${art(it.image)}<div class="meta"><p class="t">${esc(it.name)}</p><p class="s">${esc(it.subtitle||"")}</p></div>
        </button>`).join("") || `<div class="empty">Search albums, artists, playlists…</div>`}</div>`;
  } else {
    main = `<h1 class="greet">Your Library</h1>
      <div class="list">
        <button class="row-item" onclick="send({cmd:'PlayUri',uri:'spotify:collection:tracks'})">
          <div class="ph" style="background:linear-gradient(135deg,#450af5,#8e8ee5)"></div>
          <div class="meta"><p class="t">Liked Songs</p><p class="s">Collection</p></div>
        </button>
        ${(state.library||[]).map(it=>`
        <button class="row-item" onclick="send({cmd:'PlayUri',uri:'${esc(it.uri)}'})">
          ${art(it.image)}<div class="meta"><p class="t">${esc(it.name)}</p><p class="s">${esc(it.subtitle||"Playlist")}</p></div>
        </button>`).join("")}
      </div>`;
  }

  root.innerHTML = `
  <div id="app">
    <aside id="rail">
      <div class="brand">Sloptify</div>
      <button class="nav-btn ${nav==="home"?"on":""}" onclick="setNav('home')">Home</button>
      <button class="nav-btn ${nav==="search"?"on":""}" onclick="setNav('search')">Search</button>
      <button class="nav-btn ${nav==="library"?"on":""}" onclick="setNav('library')">Your Library</button>
    </aside>
    <main id="main">${main}</main>
    <footer id="player">
      <div class="np" onclick="openSheet()">
        ${art(np.image)}
        <div class="meta" style="min-width:0"><p class="t">${esc(trunc(np.title,36))}</p><p class="s">${esc(trunc(np.artist,36))}</p></div>
      </div>
      <div class="controls">
        <div class="btns">
          <button onclick="send({cmd:'Previous'})" title="Previous">⏮</button>
          <button class="main" onclick="send({cmd: ${np.paused?"'Resume'":"'Pause'"}})">${np.paused?"▶":"⏸"}</button>
          <button onclick="send({cmd:'Next'})" title="Next">⏭</button>
        </div>
        <div class="scrub">
          <span>${ms(np.pos)}</span>
          <input type="range" min="0" max="${np.dur}" value="${np.pos}" onchange="send({cmd:'Seek',positionMs:+this.value})" />
          <span>${ms(np.dur)}</span>
        </div>
      </div>
      <div class="right">
        <span>🔊</span>
        <input type="range" min="0" max="100" value="80" onchange="send({cmd:'SetVolume',level:this.value/100})" />
      </div>
    </footer>
    <nav id="tabs">
      <button class="${nav==="home"?"on":""}" onclick="setNav('home')"><span>⌂</span>Home</button>
      <button class="${nav==="search"?"on":""}" onclick="setNav('search')"><span>⌕</span>Search</button>
      <button class="${nav==="library"?"on":""}" onclick="setNav('library')"><span>☰</span>Library</button>
    </nav>
  </div>
  <div id="sheet" class="${sheetOpen?"open":""}">
    <div class="top"><button onclick="closeSheet()">▼</button><span>${esc(np.context||"Now playing")}</span><span></span></div>
    <div class="cover">${art(np.image)}</div>
    <p class="title">${esc(np.title)}</p>
    <p class="artist">${esc(np.artist)}</p>
    <div class="scrub" style="width:100%;max-width:520px;margin:0 auto">
      <span>${ms(np.pos)}</span>
      <input type="range" min="0" max="${np.dur}" value="${np.pos}" onchange="send({cmd:'Seek',positionMs:+this.value})" />
      <span>${ms(np.dur)}</span>
    </div>
    <div class="big-controls">
      <button onclick="send({cmd:'Previous'})">⏮</button>
      <button class="main" onclick="send({cmd: ${np.paused?"'Resume'":"'Pause'"}})">${np.paused?"▶":"⏸"}</button>
      <button onclick="send({cmd:'Next'})">⏭</button>
    </div>
  </div>`;
}

function setNav(n){ nav=n; if(n==="library") send({cmd:"LoadLibrary",filter:""}); render(); }
function setChip(i,id){ chip=i; send({cmd:"RefreshHome",facet:id||""}); render(); }
function doSearch(){ const el=document.getElementById("sq"); searchQ=el?el.value:searchQ; send({cmd:"Search",query:searchQ}); }
function openSheet(){ sheetOpen=true; render(); }
function closeSheet(){ sheetOpen=false; render(); }

window.__sloptifyPush = (json) => {
  try {
    const next = typeof json === "string" ? JSON.parse(json) : json;
    state = Object.assign({}, state, next);
    render();
  } catch (e) { console.error(e); }
};
render();
</script>
</body>
</html>
